<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Glowing Gourmet Card - Magic UI style</title>
    <!-- Google Fonts for Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for modern icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #030303;
            --card-bg: rgba(9, 9, 11, 0.7);
            --primary-orange: #fc8019;
            --primary-magenta: #ff007f;
            --primary-violet: #7f00ff;
            --text-main: #f4f4f5;
            --text-muted: #8e8e93;
            --accent-green: #10b981;
            --font-sans: 'Plus Jakarta Sans', sans-serif;
            --transition-smooth: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: var(--font-sans);
            overflow: hidden;
            position: relative;
        }

        /* Modern Grid Background with radial vignette */
        .background-grid {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
        }

        .background-mask {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 10%, var(--bg-color) 75%);
            z-index: 2;
            pointer-events: none;
        }

        /* Magic UI Interactive Container */
        .card-container {
            position: relative;
            width: 360px;
            height: 540px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Floating Aurora behind the card */
        .card-aurora {
            position: absolute;
            width: 320px;
            height: 320px;
            background: radial-gradient(
                circle,
                rgba(252, 128, 25, 0.35) 0%,
                rgba(255, 0, 127, 0.25) 45%,
                rgba(127, 0, 255, 0.15) 70%,
                transparent 100%
            );
            filter: blur(45px);
            border-radius: 50%;
            z-index: 3;
            animation: floatAurora 10s ease-in-out infinite;
            pointer-events: none;
            transition: var(--transition-smooth);
        }

        @keyframes floatAurora {
            0%, 100% {
                transform: translate(-10px, -15px) scale(1);
            }
            50% {
                transform: translate(25px, 20px) scale(1.15);
            }
        }

        .card-container:hover .card-aurora {
            animation-play-state: paused;
            transform: scale(1.3);
            filter: blur(35px);
            background: radial-gradient(
                circle,
                rgba(252, 128, 25, 0.45) 0%,
                rgba(255, 0, 127, 0.35) 45%,
                rgba(127, 0, 255, 0.25) 70%,
                transparent 100%
            );
        }

        /* Shiny Border Card - Aeternity style using mask border */
        .shiny-card {
            position: relative;
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 4;
            transition: var(--transition-smooth);
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.05),
                0 15px 50px -15px rgba(0, 0, 0, 0.9);
        }

        /* Animated border using webkit mask-composite */
        .shiny-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 24px;
            padding: 1.5px; /* Border thickness */
            background: linear-gradient(
                135deg,
                rgba(252, 128, 25, 0.4),
                rgba(255, 255, 255, 0.02),
                rgba(127, 0, 255, 0.4)
            );
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box, 
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 5;
            transition: var(--transition-smooth);
        }

        .card-container:hover .shiny-card {
            transform: translateY(-8px);
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.1),
                0 30px 60px -15px rgba(0, 0, 0, 0.95);
        }

        .card-container:hover .shiny-card::before {
            background: linear-gradient(
                135deg,
                var(--primary-orange),
                var(--primary-magenta),
                var(--primary-violet)
            );
        }

        /* Glass shiny overlay reflections */
        .shiny-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(
                circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(255, 255, 255, 0.06) 0%,
                transparent 50%
            );
            z-index: 3;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* Image viewport */
        .card-media {
            position: relative;
            height: 240px;
            width: 100%;
            overflow: hidden;
            padding: 12px 12px 0 12px; /* floating card frame */
        }

        .card-media-inner {
            width: 100%;
            height: 100%;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-container:hover .card-image {
            transform: scale(1.06);
        }

        /* Smooth gradient bottom shadow inside media */
        .card-media-inner::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(9, 9, 11, 0.6) 0%, transparent 100%);
            z-index: 2;
        }

        /* Dietary type badge */
        .dietary-badge {
            position: absolute;
            top: 1rem;
            left: 1rem;
            background: rgba(9, 9, 11, 0.75);
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            z-index: 10;
            backdrop-filter: blur(4px);
        }

        .veg-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
        }

        .dietary-text {
            color: var(--text-main);
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        /* Details area */
        .card-details {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            z-index: 6;
        }

        .tagline-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .category-tag {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary-orange);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .prep-time {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .dish-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: -0.015em;
            line-height: 1.25;
        }

        .dish-price {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-main);
        }

        .ingredients-list {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }

        /* Modern hover-effect Action CTA Button */
        .btn-add {
            position: relative;
            background: #ffffff;
            color: #030303;
            border: none;
            width: 100%;
            height: 48px;
            border-radius: 14px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            transition: var(--transition-smooth);
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
        }

        .btn-add:hover {
            background: var(--primary-orange);
            color: #ffffff;
            box-shadow: 0 10px 25px rgba(252, 128, 25, 0.45);
            transform: translateY(-2px);
        }

        .btn-add:active {
            transform: translateY(0);
        }

        /* Interactive cursor reflection highlight */
        .btn-add::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            transition: all 0.6s ease;
        }

        .btn-add:hover::before {
            left: 100%;
        }
    </style>
</head>
<body>

    <!-- Modern Dark Grid Background -->
    <div class="background-grid"></div>
    <div class="background-mask"></div>

    <div class="card-container">
        <!-- Magic UI Neon Aurora Glow -->
        <div class="card-aurora"></div>

        <!-- Glassmorphic Shiny Card -->
        <div class="shiny-card" id="hover-card">
            <!-- Media Section -->
            <div class="card-media">
                <div class="card-media-inner">
                    <!-- Veg Badge -->
                    <div class="dietary-badge">
                        <span class="veg-dot"></span>
                        <span class="dietary-text">Veg</span>
                    </div>
                    <!-- Image -->
                    <img class="card-image" src="https://images.unsplash.com/photo-1668236543090-82eba5ee5976?w=600&auto=format&fit=crop&q=80" alt="Masala Dosa">
                </div>
            </div>

            <!-- Details Section -->
            <div class="card-details">
                <div>
                    <!-- Tagline -->
                    <div class="tagline-row">
                        <span class="category-tag">South Indian Special</span>
                        <span class="prep-time"><i class="fa-regular fa-clock"></i> 15 mins</span>
                    </div>
                    <!-- Title & Price -->
                    <div class="title-row">
                        <h2 class="dish-title">Classic Masala Dosa</h2>
                        <span class="dish-price">₹120</span>
                    </div>
                    <!-- Ingredients -->
                    <p class="ingredients-list">
                        Crispy golden rice crepe folded with spiced potato mash, enriched with pure ghee. Served with coconut chutney and fresh sambar.
                    </p>
                </div>

                <!-- Call to Action Button -->
                <button class="btn-add">
                    <i class="fa-solid fa-plus"></i>
                    <span>Add to Cart</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Mouse reflection script for moving shine highlights -->
    <script>
        const card = document.getElementById('hover-card');
        document.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            card.style.setProperty('--mouse-x', `${(x / rect.width) * 100}%`);
            card.style.setProperty('--mouse-y', `${(y / rect.height) * 100}%`);
        });
    </script>
</body>
</html>
